site:
  name: BEACON
  base: '/'
  trailingSlash: false

metadata:
  title:
    default: 'BEACON — Bedside Emergency AI for Care Orchestration'
    template: '%s — BEACON'
  description: 'BEACON brings clinicians, engineers, AI researchers, and startup partners together to improve emergency decisions and recovery after trauma, brain injury, and stroke.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: BEACON
    images:
      - url: '~/assets/images/beacon/beacon-social.png'
        width: 600
        height: 600
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6
    isRelatedPostsEnabled: false
    relatedPostsCount: 0

ui:
  theme: 'light:only'

analytics:
  vendors:
    googleAnalytics:
      id: null
